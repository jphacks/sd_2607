[tools]
rust = "1.97.1"
node = "24"
uv = "0.9"

[tasks.setup]
description = "Install the frontend and Tauri CLI dependencies"
run = "npm ci"

[tasks.dev]
description = "Run the app with hot reload"
depends = ["setup"]
run = "npm run tauri dev"

[tasks.build]
description = "Build the release app bundle (src-tauri/../target/release/bundle)"
depends = ["setup"]
run = "npm run tauri build"

[tasks.build-linux]
description = "Build the .deb/.rpm/.AppImage in an Ubuntu 22.04 container (target/linux/release/bundle; needs podman)"
run = "scripts/build_linux.sh"

[tasks.test]
description = "Run the simulation tests and type-check the frontend"
depends = ["setup"]
run = ["cargo test -p mosimo-sim-core --release", "npx tsc --noEmit"]

[tasks.sim]
description = "Run headless: mise run sim -- noto 0 0.5 0.9 --seeds 3 [--trace] [--hours H] [--rescue F]"
run = "cargo run -q --release -p mosimo-sim-core --bin mosimo-sim --"

[tasks.experiments]
description = "Run the experiment suite and write experiments/results.json and experiments/report.md"
run = "cargo run -q --release -p mosimo-sim-core --bin experiments -- experiments"

[tasks.scenarios]
description = "Regenerate core/scenarios/*.json from generate.py and the geography files"
run = "uv run --with numpy python3 core/scenarios/generate.py"

[tasks.geo]
description = "Rebuild households, districts and roads from e-Stat, OpenStreetMap and 地理院 DEM (downloads into ~/.cache/mosimo-sim)"
run = [
  "uv run --with numpy --with scipy python3 core/scenarios/data/build_geo.py shelter",
  "uv run --with numpy --with scipy python3 core/scenarios/data/build_geo.py noto",
]

[tasks.installer-images]
description = "Regenerate the WiX/NSIS installer bitmaps in src-tauri/icons/installer (Windows fonts required)"
run = "uv run --with pillow python src-tauri/icons/installer/generate.py ../hp/public/images/mosimo-bosai-icon.png src-tauri/icons/installer"

[tasks.installer-images-macos]
description = "Regenerate the DMG background and icon.icns (macOS required)"
run = "uv run --with pillow python src-tauri/icons/installer/generate_macos.py ../hp/public/images/mosimo-bosai-icon.png src-tauri/icons/installer src-tauri/icons/icon.icns"

[tasks.publish-hp]
description = "Copy the built installers into ../hp/public/downloads/simulator and update the download manifest (run after build or build-linux)"
run = "uv run python scripts/publish_hp.py"
