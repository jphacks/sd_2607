[package]
name = "mosimo-sim-core"
description = "Agent-based simulation of disaster information propagation with and without the Mosimo protocol"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"

[[bin]]
name = "mosimo-sim"
path = "src/bin/mosimo-sim.rs"

[[bin]]
name = "experiments"
path = "src/bin/experiments.rs"
