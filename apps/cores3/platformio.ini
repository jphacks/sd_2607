; CoreS3 touch UI build. The relay itself (BLE/Bundle/Negentropy) is shared with
; ../esp32; only the UI and the board wiring live here. No TTS: the evaluation SDK
; ships an ESP32 (LX6) library only.
[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
build_src_filter =
    +<*>
    +<../../esp32/src/>
    -<../../esp32/src/main.cpp>
    -<../../esp32/src/MeshSpeech.cpp>
build_flags =
    -I../esp32/include
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.2

; Bench build: UART "screenshot" / "tap X Y" commands for checking the UI without a camera.
[env:m5stack-cores3-debug]
extends = env:m5stack-cores3
build_flags =
    ${env:m5stack-cores3.build_flags}
    -DUI_DEBUG_COMMANDS=1
