[platformio]
default_envs = m5stack-tts

[env:m5stack-tts]
platform = espressif32@6.12.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
extra_scripts = pre:scripts/aquestalk_build.py
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1


lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.2

; BLE only: no Wi-Fi gateway or speech SDK.
[env:m5stack]
extends = env:m5stack-tts
extra_scripts =
build_src_filter = +<*> -<MeshSpeech.cpp>
build_flags =
    ${env:m5stack-tts.build_flags}
    -DMESH_SPEECH_DISABLED=1

; Internet gateway profile: larger single app slot, TTS off to reserve TLS RAM.
[env:m5stack-wifi]
extends = env:m5stack-tts
board_build.partitions = partitions-gateway.csv
extra_scripts =
build_src_filter = +<*> -<MeshSpeech.cpp>
build_flags =
    ${env:m5stack-tts.build_flags}
    -DMESH_GATEWAY_BUILD=1
    -DMESH_SPEECH_DISABLED=1

; Optional combined profile. Same gateway partition map; SDK/TLS work is serialized.
[env:m5stack-wifi-tts]
extends = env:m5stack-wifi
extra_scripts = pre:scripts/aquestalk_build.py
build_src_filter = +<*>
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DMESH_GATEWAY_BUILD=1
    -DMESH_GATEWAY_TTS=1
    -DARDUINO_LOOP_STACK_SIZE=12288


[env:m5stack-wifi-tts-check]
extends = env:m5stack-wifi-tts
build_flags =
    ${env:m5stack-wifi-tts.build_flags}
    -DMESH_GATEWAY_CONFIG_HEADER=\"GatewayConfig.check.h\"

; Compile the complete optional networking path without real credentials.
[env:m5stack-wifi-check]
extends = env:m5stack-wifi
build_flags =
    ${env:m5stack-wifi.build_flags}
    -DMESH_GATEWAY_CONFIG_HEADER=\"GatewayConfig.check.h\"

; Explicit opt-in laboratory build. Normal m5stack-tts remains unrestricted.
[env:m5stack-tts-diagnostic]
extends = env:m5stack-tts
build_flags =
    ${env:m5stack-tts.build_flags}
    -DMESH_TEST_DIAGNOSTICS=1
    -DMESH_TEST_NODE_ID=0xa7fb2785f1068ab5ULL
    -DMESH_GATT_TRACE=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=4
    -DMYNEWT_VAL_BLE_HS_LOG_LVL=0
    -DCORE_DEBUG_LEVEL=4
