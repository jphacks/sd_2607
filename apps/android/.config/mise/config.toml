[tools]
age = "latest"
android-sdk = "23"
"gem:bundler" = "latest"
java = "openjdk-21"
sops = "3.13.3"

[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[env]
SOPS_CONFIG = "{{ config_root }}/.config/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{ get_env(name='SOPS_AGE_KEY_FILE', default=config_root ~ '/.config/mise/age.txt') }}"

[tasks.sdk-setup]
hide = true
interactive = true
run = 'android sdk install platforms/android-36 build-tools/36.0.0'

[tasks.gem-setup]
hide = true
run = "bundle check || bundle install"

[tasks.test]
depends = ["sdk-setup"]
description = "Run Android and shared unit tests"
run = "./gradlew :dtn7-bpv7:test :bundle-core:test :mesh-android:testDebugUnitTest :app:testDebugUnitTest"
run_windows = "gradlew.bat :dtn7-bpv7:test :bundle-core:test :mesh-android:testDebugUnitTest :app:testDebugUnitTest"

[tasks.lint]
depends = ["sdk-setup"]
description = "Run Android lint"
run = "./gradlew :app:lintDebug"
run_windows = "gradlew.bat :app:lintDebug"

[tasks.apk]
depends = ["sdk-setup"]
description = "Build the debug APK"
run = "./gradlew :app:assembleDebug"
run_windows = "gradlew.bat :app:assembleDebug"

[tasks.age-keygen]
description = "Generate a new age key pair"
run = 'age-keygen -o "{{ config_root }}/.config/mise/age.txt"'

[tasks.fastlane-test]
depends = ["gem-setup"]
description = "Test the fastlane configuration"
run = "bundle exec ruby fastlane/test_fastfile.rb"

[tasks.ci]
depends = ["sdk-setup", "gem-setup"]
description = "Run unit tests, lint, and build the debug APK via fastlane"
run = "bundle exec fastlane android ci app:mosimo"

[tasks.aab]
depends = ["sdk-setup", "gem-setup"]
description = "Build a signed release AAB"
env._.file = { path = "{{ config_root }}/secrets/release.sops.yaml", redact = true }
env.ANDROID_KEYSTORE_PATH = "{{ config_root }}/release_key.jks"
run = "bundle exec fastlane android build app:mosimo"

[tasks.deploy]
depends = ["sdk-setup", "gem-setup"]
description = "Test, build, and deploy to Google Play internal testing"
env._.file = [
    { path = "{{ config_root }}/secrets/release.sops.yaml", redact = true },
    { path = "{{ config_root }}/secrets/deploy.sops.yaml", redact = true },
]
env.ANDROID_KEYSTORE_PATH = "{{ get_env(name='ANDROID_KEYSTORE_PATH', default=config_root ~ '/release_key.jks') }}"
run = "bundle exec fastlane android internal app:mosimo"

[tasks.github-release-apk]
depends = ["sdk-setup"]
description = "Build the release APK for GitHub Releases, signed with the GitHub release key (not the Play upload key)"
env._.file = { path = "{{ config_root }}/secrets/github-release.sops.yaml", redact = true }
# Multi-line scripts run under sh (dash) by default, which has no pipefail.
shell = "bash -c"
run = '''
set -euo pipefail
umask 077
# The source versionCode is what F-Droid and GitHub Releases use; never take the Play run number here.
unset ORG_GRADLE_PROJECT_mosimoVersionCode
ANDROID_KEYSTORE_PATH="$(mktemp)"
export ANDROID_KEYSTORE_PATH
trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
./gradlew :app:assembleRelease
'''
