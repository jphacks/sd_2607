name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'third_party/sd_2607-dtn7-kotlin/bpv7/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'third_party/sd_2607-dtn7-kotlin/bpv7/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Application to distribute
        type: choice
        options: [mosimo]
        default: mosimo
        required: true


permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && inputs.app || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: apps/android
    shell: bash

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  FASTLANE_OPT_OUT_USAGE: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "true"

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: apps/android
      - uses: gradle/actions/setup-gradle@v5
      - run: mise run fastlane-test
      - run: mise run ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mosimo-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/reports/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/test-results/

  alpha:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: play-${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      # The emulator wants 1.2x its 6 GB userdata free after the APK build; drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      # No tool cache in release jobs: https://github.com/jdx/mise-action#release-workflows
      # env: false keeps the runner SDK as ANDROID_HOME for the emulator; mise run/exec still apply mise env.
      - uses: jdx/mise-action@v5
        with:
          working_directory: apps/android
          cache: false
          env: false
      - uses: gradle/actions/setup-gradle@v5
      - run: mise run fastlane-test
      # Build before booting the emulator: a concurrent Gradle build starves it and the launcher ANRs.
      - name: Build screenshot APKs
        run: |
          mise run sdk-setup
          mise exec -- ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PmosimoPlcRegistration=false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # pixel_2 (1080x1920) satisfies Play's 2:1 aspect limit; registration off keeps the emulator out of the production PLC.
      - name: Capture Play Store screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/android
          # Hide ANR dialogs so a slow-booting launcher can't cover the screenshots.
          script: |
            "$ANDROID_HOME/platform-tools/adb" shell settings put global hide_error_dialogs 1
            mise exec -- bundle exec fastlane screengrab --android_home "$ANDROID_HOME"
      - name: Test, sign, and distribute to the Play alpha track
        env:
          SOPS_AGE_KEY: ${{ secrets.MISE_SOPS_AGE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # ponytail: versionCode = run number; resets if this workflow file is renamed, then add an offset.
          ORG_GRADLE_PROJECT_mosimoVersionCode: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          export SOPS_AGE_KEY_FILE="$RUNNER_TEMP/age.txt" ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$SOPS_AGE_KEY_FILE" "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$SOPS_AGE_KEY" > "$SOPS_AGE_KEY_FILE"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          mise run deploy
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.app }}-alpha-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/**/build/outputs/bundle/release/*.aab
            apps/android/**/build/outputs/apk/debug/*.apk
            apps/android/fastlane/metadata/android/
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/reports/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/test-results/
