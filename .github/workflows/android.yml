name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: Application to distribute
        type: choice
        options: [mosimo]
        default: mosimo
        required: true


permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && inputs.app || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: apps/android
    shell: bash

env:
  FASTLANE_OPT_OUT_USAGE: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_HIDE_CHANGELOG: "true"
  FASTLANE_SKIP_DOCS: "true"

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/android
      - run: bundle exec ruby fastlane/test_fastfile.rb
      - run: bundle exec fastlane android ci app:mosimo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mosimo-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/reports/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/test-results/

  internal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: play-${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: apps/android
      - run: bundle exec ruby fastlane/test_fastfile.rb
      - name: Test, sign, and distribute to Play internal testing
        env:
          RELEASE_APP: ${{ inputs.app }}

          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPPLY_JSON_KEY_DATA; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing secret: $key"
              exit 1
            fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bundle exec fastlane android internal "app:$RELEASE_APP"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.app }}-internal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/**/build/outputs/bundle/release/*.aab
            apps/android/**/build/outputs/apk/debug/*.apk
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/reports/
            third_party/sd_2607-dtn7-kotlin/bpv7/build/test-results/
