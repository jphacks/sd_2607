# TEMPORARY: verifies the screenshot part of android.yml's internal job on PRs. Remove before merge.
name: Android screenshots check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/android
    shell: bash

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  FASTLANE_OPT_OUT_USAGE: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "true"

jobs:
  screenshots:
    if: github.head_ref == 'feature/cicd'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: apps/android
          cache: false
          env: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Play Store screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: apps/android
          script: |
            mise run sdk-setup
            mise run gem-setup
            mise exec -- ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PmosimoPlcRegistration=false
            mise exec -- bundle exec fastlane screengrab --android_home "$ANDROID_HOME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/fastlane/metadata/android/
