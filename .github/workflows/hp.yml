name: HP

on:
  push:
    branches: [main]
    paths:
      - 'hp/**'
      - '.github/workflows/hp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - run: npm ci
        working-directory: hp
      - run: npm run check
        working-directory: hp
      - run: npm run build:pages
        working-directory: hp
      - uses: actions/upload-pages-artifact@v4
        with:
          path: hp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
